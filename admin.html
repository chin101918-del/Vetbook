              </div>

                <span style="font-size: 14px; font-weight: 600">{{cat.source}}</span>
              </div>
            </div>

                  <th style="padding: 10px 8px; font-weight: 600">อาจารย์ต้องประเมิน</th>
                  <th style="padding: 10px 20px; font-weight: 600">หน่วย/แลปที่ให้ skill นี้</th>
                </tr>
              </thead>
              <tbody>

                  <tr style="border-top: 1px solid #EEF1EC">
                    <td style="padding: 10px 20px">
                      <span style="display: flex; flex-direction: column; gap: 1px">
                        <span style="font-weight: 600">{{s.name}}</span>
                        <span style="font-size: 12px; color: #5B6B66; font-variant-numeric: tabular-nums">{{s.code}}</span>
                      </span>
                    </td>
                    <td style="padding: 10px 8px; white-space: nowrap">{{s.level}}</td>
                    <td style="padding: 10px 8px">
                      <span style="display: inline-flex; align-items: center; border: 1px solid #E2E7E1; border-radius: 10px; overflow: hidden">
                        <button aria-label="ลดจำนวน {{s.name}}" onClick="{{s.dec}}" style="width: 36px; height: 36px; border: 0; background: #FFFFFF; font-size: 18px; color: #16231F; cursor: pointer">−</button>
                        <span style="min-width: 36px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums">{{s.min}}</span>
                        <button aria-label="เพิ่มจำนวน {{s.name}}" onClick="{{s.inc}}" style="width: 36px; height: 36px; border: 0; background: #FFFFFF; font-size: 18px; color: #16231F; cursor: pointer">+</button>
                      </span>
                    </td>
                    <td style="padding: 10px 8px">
                      <button role="switch" aria-checked="{{s.evalStr}}" aria-label="ต้องประเมิน {{s.name}}" onClick="{{s.toggle}}" style="{{s.sw}}"><span style="{{s.knob}}"></span></button>
                    </td>
                    <td style="padding: 10px 20px; color: #3A4A45">{{s.from}}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div style="padding: 12px 20px; border-top: 1px solid #EEF1EC; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
            <button style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px dashed #9AAAA4; background: transparent; font-family: inherit; font-size: 14px; color: #16231F; cursor: pointer">+ เพิ่ม skill</button>

          </div>
        </section>
      </div>
    </main>
  </div>
</div>
